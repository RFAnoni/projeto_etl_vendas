name: Pipeline ETL Automático - Vendas

# 1. GATILHOS (Quando este script vai rodar?)
on:
  schedule:
    # Roda todos os dias às 03:00 da manhã (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permite rodar o pipeline manualmente por um botão no GitHub

jobs:
  executar_etl:
    runs-on: ubuntu-latest # liga uma máquina virtual Linux  

    # 2. VARIÁVEIS DE AMBIENTE (Puxando do cofre)
    env:
      API_URL_VENDAS: ${{ secrets.API_URL_VENDAS }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      # Passo 1: Baixar o código do repositório
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # Passo 2: Instalar o Python
      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Passo 3: Instalar as bibliotecas
      - name: Instalar Dependências
        run: |
          cd etl_pipeline_vendas
          pip install -r requirements.txt

      # Passo 4: Rodar a Camada Bronze (Extract)
      - name: Rodar Extração (API -> Bronze)
        run: |
          cd etl_pipeline_vendas
          python src/extract/api_client.py

      # Passo 5: Rodar a Camada Silver (Transform)
      - name: Rodar Transformação (Bronze -> Silver)
        run: |
          cd etl_pipeline_vendas
          python src/transform/transform_polars.py

      # Passo 6: Rodar a Camada Gold (Load)
      - name: Rodar Carga (Silver -> MySQL Aiven)
        run: |
          cd etl_pipeline_vendas
          python src/load/db_loader.py